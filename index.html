       .player-container {
    width: 100%;
    height: 100%;
    max-width: 480px;
    background: linear-gradient(180deg, #ff007f, #7f00ff, #00f0ff, #ff007f,#181822 0%, #0a0a0f, #ff0000, #ffd700, #00ff00, #ff0000, #ff0000, #ffd700, #00ff00, #ff0000 100%);
    border-radius: 28px; 
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.05);
    position: relative;
    box-sizing: border-box;
}

/* Το εσωτερικό περίγραμμα που εμφανίζεται κανονικά χωρίς να επηρεάζει το μέγεθος */
.player-container::before {
    content: '';
    position: absolute;
    /* Τοποθέτηση ακριβώς στις άκρες */
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 28px;
    /* Πάχος περιγράμματος 3px */
    padding: 4px; 
    background: linear-gradient(135deg, #ff007f, #7f00ff, #00f0ff, #ff007f,#181822 0%, #0a0a0f, #ff0000, #ffd700, #00ff00, #ff0000, #ff0000, #ffd700, #00ff00, #ff0000);
    background-size: 200% 200%;
    
    /* Δημιουργία εσωτερικής μάσκας */
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: source-out; /* Διορθώθηκε για απόλυτη συμβατότητα */
    mask-composite: exclude;
    
    pointer-events: none;
    z-index: 999; /* Το φέρνει μπροστά για να φαίνεται, αλλά χωρίς να εμποδίζει τα κλικ */
    animation: moveGradient 6s linear infinite;
}

/* Το animation για την κίνηση των χρωμάτων */
@keyframes moveGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}


        
        .widget-area {

        .widget-iframe {

            100% {

.btn-play-wrapper {
    position: relative;
    width: 76px;
    height: 76px;
    display: flex;
    justify-content: center;
    align-items: center;
}


.btn-play {
    border: none;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 5;
    transition: background-color 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
}

.btn-play:active {
    transform: scale(0.92);
}

.btn-play svg {
    width: 32px;
    height: 32px;
    transition: fill 0.3s ease;
}


/* Κατάσταση 1: Αρχική Αναμονή (Κόκκινο με το δικό σας εφέ παλμού) */
.btn-play.ready {
    background: #ff0000 !important;
    box-shadow: 0 0 15px #ff0000 !important;
    animation: redPulse 2s infinite ease-in-out;
}
.btn-play.ready svg {
    fill: #ffffff;
}

/* Κατάσταση 2: Φόρτωση / Buffering (Πορτοκαλί) */
.btn-play.loading {
    background: #ffaa00 !important; /* Αλλάχτηκε σε Πορτοκαλί */
    box-shadow: 0 0 20px #ffaa00 !important;
    animation: redPulse 0.8s infinite ease-in-out; /* Διατήρηση του γρήγορου παλμού σας */
}
.btn-play.loading svg {
    fill: #ffffff;
}

/* Κατάσταση 3: Αναπαραγωγή (Το δικό σας ζωντανό Πράσινο) */
.btn-play.playing {
    background: #39ff14 !important;
    box-shadow: 0 0 20px #39ff14, inset 0 0 10px rgba(0,0,0,0.2) !important;
    animation: none;
}
.btn-play.playing svg {
    fill: #14141c; 
}

/* Το χρυσό δαχτυλίδι (Αυτούσιο το δικό σας, έμεινε άθικτο) */
.gold-ring {
    position: absolute;
    width: 86px;  
    height: 86px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #ffd700;
    border-bottom-color: #ffd700;
    z-index: 4;
    opacity: 0; 
    transition: opacity 0.4s ease;
}



.btn-play.playing ~ .gold-ring {
    opacity: 1;
    animation: spinGold 2s linear infinite;
}




@keyframes redPulse {
    0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
    }
    50% {
        transform: scale(1.03);
        box-shadow: 0 0 25px rgba(255, 0, 0, 1), 0 0 35px rgba(255, 0, 0, 0.5);
    }
    100% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
    }
}


@keyframes spinGold {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

#volumeSlider {

        background-size: 100% auto !important; /* Πιο πυκνά χρώματα */

 /* Αργή κίνηση πέρα-δώθε */

}

}



#volumeSlider::-webkit-slider-thumb {

    transition: transform 0.1s;
}

}


.volume-tick {

<script>
       const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');

    const playSVG = '<path d="M8 5v14l11-7z"/>';
    const pauseSVG = `
        <circle cx="7.5" cy="4" r="1.5" fill="#14141c"/>
        <circle cx="16.5" cy="4" r="1.5" fill="#14141c"/>
        <path d="M6 14h3V7H6v7zm9-7v7h3V7h-3z"/>
        <path d="M4.5 16.5 C 4.5 22.5, 19.5 22.5, 19.5 16.5" fill="none" stroke="#14141c" stroke-width="2" stroke-linecap="round"/>
    `;

    audio.volume = 0.5;

    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            playBtn.classList.add('loading');
            audio.play()
                .then(() => {
                    playBtn.classList.remove('loading', 'ready');
                    playBtn.classList.add('playing');
                    playIcon.innerHTML = pauseSVG;
                })
                .catch(error => {
                    playBtn.classList.remove('loading', 'playing');
                    playBtn.classList.add('ready');
                    alert("Αδυναμία φόρτωσης. Δοκιμάστε ξανά.");
                });
        } else {
            audio.pause();
            audio.src = ""; 
            audio.src = "https://stream.rcast.net/200586";
            
            if (customArtwork && liveWidget) {
                customArtwork.style.display = 'none';
                customArtwork.src = ""; 
                liveWidget.style.display = 'block'; 
            }
            if (youtubePlayer) {
                youtubePlayer.style.display = 'none';
                youtubePlayer.src = "";
            }
            
            trackItems.forEach(i => i.classList.remove('active'));
            playBtn.classList.remove('playing', 'loading');
            playBtn.classList.add('ready');
            playIcon.innerHTML = playSVG;
        }
    });

    const volumeSlider = document.getElementById('volumeSlider');
    const volumeNumber = document.getElementById('volumeNumber');
    if (volumeSlider && volumeNumber) {
        volumeSlider.addEventListener('input', (e) => {
            volumeNumber.textContent = e.target.value;
            audio.volume = e.target.value / 100;
        });
    }

    function updateClock() {
        const now = new Date();
        const dateEl = document.getElementById('currentDate');
        const timeEl = document.getElementById('currentTime');
        
        if (dateEl) {
            let dayName = now.toLocaleDateString('el-GR', { weekday: 'short' });
            dayName = dayName.charAt(0).toUpperCase() + dayName.slice(1);
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            dateEl.textContent = `${dayName}, ${day}/${month}/${now.getFullYear()}`;
        }
        
        if (timeEl) {
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'ΜΜ' : 'ΠΜ';
            hours = hours % 12; hours = hours ? hours : 12;
            timeEl.textContent = `${String(hours).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} ${ampm}`;
        }

                // === ΑΥΤΟΜΑΤΗ ΑΛΛΑΓΗ ΕΙΚΟΝΑΣ ΗΛΙΟΥ / ΦΕΓΓΑΡΙΟΥ ===
        const iconEl = document.getElementById('weatherIcon');
        if (iconEl) {
            const currentHour = now.getHours();
            
            // Οι σύνδεσμοι για τις εικόνες
            const sunURL = "https://cdn-icons-png.flaticon.com/512/869/869869.png";
            const moonURL = "https://cdn-icons-png.flaticon.com/128/740/740878.png"; // Ένα πανέμορφο φεγγάρι στο ίδιο στυλ
            
            // Από τις 06:00 το πρωί έως τις 18:59 το απόγευμα δείξε Ήλιο
            if (currentHour >= 6 && currentHour < 19) {
                if (iconEl.src !== sunURL) {
                    iconEl.src = sunURL;
                }
            } else {
                // Από τις 19:00 το απόγευμα έως τις 05:59 το πρωί δείξε Φεγγάρι
                if (iconEl.src !== moonURL) {
                    iconEl.src = moonURL;
                }
            }
        }

        }
   
    updateClock(); 
    setInterval(updateClock, 1000);

// ΣΥΝΑΡΤΗΣΗ ΑΥΤΟΜΑΤΟΥ ΚΑΙΡΟΥ ΚΑΙ ΠΟΛΗΣ (ΔΙΟΡΘΩΜΕΝΗ)
async function updateWeatherReal() {
    try {
        const geoRes = await fetch("https://get.geojs.io/v1/ip/geo.json");
        const d = await geoRes.json();
        
        if (d && d.latitude && d.longitude) {
            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${d.latitude}&longitude=${d.longitude}&current_weather=true`);
            const w = await weatherRes.json();
            
            if (w && w.current_weather) {
                var cityName = d.city ? d.city.toUpperCase() : "ΑΘΗΝΑ";
                var temperature = Math.round(w.current_weather.temperature);
                document.getElementById("weatherRealText").innerHTML = cityName + " | " + temperature + "°C";
            }
        }
    } catch (e) {
        console.log("Σφάλμα καιρού:", e);
    }
}


    
    const menuBtn = document.getElementById('menuBtn');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    const playlistOverlay = document.getElementById('playlistOverlay');
    const youtubeBtn = document.getElementById('youtubeBtn');
    const closeYoutubeBtn = document.getElementById('closeYoutubeBtn');
    const youtubeOverlay = document.getElementById('youtubeOverlay');
    const liveWidget = document.getElementById('liveWidget');
    const customArtwork = document.getElementById('customArtwork');
    const youtubePlayer = document.getElementById('youtubePlayer');
    const trackItems = document.querySelectorAll('.track-item');
    const loadVideoBtn = document.getElementById('loadVideoBtn');

   
    if (menuBtn) menuBtn.addEventListener('click', () => playlistOverlay.classList.add('open'));
    if (closeMenuBtn) closeMenuBtn.addEventListener('click', () => playlistOverlay.classList.remove('open'));
    if (youtubeBtn) youtubeBtn.addEventListener('click', () => youtubeOverlay.classList.add('open'));
    if (closeYoutubeBtn) closeYoutubeBtn.addEventListener('click', () => youtubeOverlay.classList.remove('open'));

    trackItems.forEach(item => {
        item.addEventListener('click', () => {
            trackItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            audio.pause();
            if (youtubePlayer) { youtubePlayer.style.display = 'none'; youtubePlayer.src = ""; }
            audio.src = item.getAttribute('data-url');
            liveWidget.style.display = 'none';
            customArtwork.src = item.getAttribute('data-img');
            customArtwork.style.display = 'block';
            playlistOverlay.classList.remove('open');
            
            playBtn.classList.remove('ready', 'loading');
            playBtn.classList.add('playing');
            playIcon.innerHTML = pauseSVG;
            audio.play();
        });
    });

              
    if (loadVideoBtn) {
        loadVideoBtn.addEventListener('click', () => {
            audio.pause(); // trackItems.forEach(i => i.classList.remove('active'));
            
            liveWidget.style.display = 'none';
            customArtwork.style.display = 'none';
            youtubePlayer.style.display = 'block';
            
            youtubeOverlay.classList.remove('open');
            
           playBtn.classList.remove('ready', 'loading');
            playBtn.classList.add('playing');
            playIcon.innerHTML = pauseSVG;
        });
    }


       // Κρατάμε μόνο τον καιρό στο αρχικό script!
    updateWeatherReal();
    setInterval(updateWeatherReal, 900000);


</script><!-- Διορθωμένο Script: Δυναμικό ύψος για να "μαζεύει" το Chat όταν μικραίνει ο browser -->
<!-- Έξυπνο block JavaScript: Παγώνει τα πάντα στη σελίδα για ασταμάτητο YouTube στο κινητό -->
<script>
    (function() {
        // Κρατάμε τις ταυτότητες των intervals για να μπορούμε να τα σταματάμε
        let clockInterval = null;
        let metadataInterval = null;

        // Συναρτήσεις για Διαχείριση των Διεργασιών (Start / Stop)
        function startAllBackgroundTasks() {
            // 1. Ξεκινάει το ρολόι ανά δευτερόλεπτο (αν υπάρχει η συνάρτηση)
            if (typeof updateClock === 'function' && !clockInterval) {
                clockInterval = setInterval(updateClock();
            }
            // 2. Ξεκινάει η ανανέωση των τίτλων ανά 10 δευτερόλεπτα
            if (!metadataInterval) {
                metadataInterval = setInterval(() => {
                    const iframe = document.getElementById('metadataIframe');
                    if (iframe) iframe.src = iframe.src;
                }, 10000);
            }
        }

        function stopAllBackgroundTasks() {
            // Σταματάμε το ρολόι και τους τίτλους για να ελαφρύνει 100% το κινητό
            if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
            if (metadataInterval) { clearInterval(metadataInterval); metadataInterval = null; }
        }

        window.addEventListener('load', () => {
            const chatButton = document.getElementById('chatBtn');
            const youtubeButton = document.getElementById('youtubeBtn');
            const closeButton = document.getElementById('closeYoutubeBtn');
            const loadVideoBtn = document.getElementById('loadVideoBtn');
            const sharedOverlay = document.getElementById('youtubeOverlay');
            
            const chatContainer = document.getElementById('chatContainer');
            const youtubeContainer = document.getElementById('youtubeContainer');
            const overlayTitle = document.getElementById('overlayTitle');

            // Αρχική εκκίνηση των διεργασιών μόλις φορτώσει η σελίδα
            startAllBackgroundTasks();

            // Λειτουργία όταν πατάμε το "Άνοιγμα Chat"
            if (chatButton && sharedOverlay) {
                chatButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (youtubeContainer) youtubeContainer.style.display = 'none'; 
                    if (chatContainer) {
                        chatContainer.style.display = 'block'; 
                        chatContainer.style.height = 'calc(100% - 60px)'; 
                    }
                    if (overlayTitle) overlayTitle.textContent = "Live Chat"; 
                    
                    sharedOverlay.style.setProperty('display', 'block', 'important');
                    setTimeout(() => {
                        sharedOverlay.style.opacity = '1';
                        sharedOverlay.style.pointerEvents = 'auto';
                    }, 10);
                });
            }

            // Λειτουργία όταν ανοίγουμε το YouTube (από το μενού)
            if (youtubeButton && sharedOverlay) {
                youtubeButton.addEventListener('click', () => {
                    if (chatContainer) chatContainer.style.display = 'none'; 
                    if (youtubeContainer) youtubeContainer.style.display = 'block'; 
                    if (overlayTitle) overlayTitle.textContent = "YouTube Video"; 
                    
                    // ΠΑΓΩΝΟΥΜΕ ΤΑ ΠΑΝΤΑ: Το κινητό αφοσιώνεται μόνο στο βίντεο
                    stopAllBackgroundTasks();

                    sharedOverlay.style.setProperty('display', 'block', 'important');
                    setTimeout(() => {
                        sharedOverlay.style.opacity = '1';
                        sharedOverlay.style.pointerEvents = 'auto';
                    }, 10);
                });
            }

            // Λειτουργία όταν πατάμε "Έναρξη Βίντεο"
            if (loadVideoBtn && sharedOverlay) {
                loadVideoBtn.addEventListener('click', () => {
                    sharedOverlay.style.opacity = '0';
                    sharedOverlay.style.pointerEvents = 'none';
                    setTimeout(() => {
                        sharedOverlay.style.setProperty('display', 'none', 'important');
                    }, 300);
                });
            }

            // Λειτουργία όταν κλείνουμε το παράθυρο με το "Χ"
            if (closeButton && sharedOverlay) {
                closeButton.addEventListener('click', () => {
                    sharedOverlay.style.opacity = '0';
                    sharedOverlay.style.pointerEvents = 'none';
                    setTimeout(() => {
                        sharedOverlay.style.setProperty('display', 'none', 'important');
                        
                        // ΕΠΑΝΑΦΟΡΑ: Ξεκινάνε πάλι το ρολόι και οι τίτλοι κανονικά
                        startAllBackgroundTasks();
                    }, 300);
                });
            }
        });
    })();
</script>
